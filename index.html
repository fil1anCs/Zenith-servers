<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZENITH</title>
<style>
:root{--el:#121212;--mut:#a1a1a6;--ac:#e5e5e7;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:#fff;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;position:relative}
svg.i{width:22px;height:22px;fill:currentColor;flex:none}
#app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:1fr 88px;gap:8px;padding:8px;height:100dvh}
#side{background:var(--el);border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.logo{display:flex;align-items:center;gap:10px;padding:8px 12px 14px;font-weight:800;letter-spacing:.3em;font-size:18px}
.logo svg{width:28px;height:28px}
.nv{display:flex;gap:16px;align-items:center;padding:10px 12px;color:var(--mut);font-weight:700;width:100%;border-radius:6px;text-align:left}
.nv:hover,.nv.on{color:#fff}
.sh{padding:14px 12px 6px;color:var(--mut);font-weight:700}
.pls{flex:1;overflow:auto}
.lrow{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}
.lrow:hover{background:#1f1f1f}
.lrow .cv{width:48px;flex:none}
.lrow>div:last-child{min-width:0}
.lrow b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lrow span{display:block;color:var(--mut);font-size:13px}
#main{background:linear-gradient(180deg,hsl(var(--h,260) 5% 24%) 0,var(--el) 340px);border-radius:10px;overflow:auto;padding:24px 24px 28px}
h1{font-size:32px;font-weight:800;margin-bottom:18px}
h2{font-size:22px;font-weight:700;margin:30px 0 14px}
.xl{font-size:clamp(30px,6vw,68px);line-height:1.05;margin:6px 0 14px;word-break:break-word}
.mut,small{color:var(--mut)}
.mlogo{display:none}
.cv{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;background:radial-gradient(circle at 25% 20%,hsl(var(--h) 8% 62%),transparent 55%),linear-gradient(135deg,hsl(var(--h) 6% 40%),hsl(var(--h) 4% 15%))}
.cv svg{width:42%;height:42%;fill:rgba(255,255,255,.88)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.09);border-radius:6px;overflow:hidden;cursor:pointer;position:relative;font-weight:700;min-width:0}
.tile>span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile:hover{background:rgba(255,255,255,.17)}
.tile .cv{width:56px;border-radius:0;flex:none}
.pbtn{width:46px;height:46px;border-radius:50%;background:var(--ac);color:#000;display:grid;place-items:center;flex:none}
.tile .pbtn,.card .pbtn{position:absolute;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 8px 16px rgba(0,0,0,.45)}
.tile .pbtn{right:10px;top:5px}
.card .pbtn{right:22px;bottom:76px}
.tile:hover .pbtn,.card:hover .pbtn{opacity:1;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px}
.card{background:#181818;padding:14px;border-radius:8px;cursor:pointer;position:relative;transition:background .2s;min-width:0}
.card:hover{background:#262626}
.card .cv{margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card b,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--mut);font-size:13px}
.hd{display:flex;align-items:flex-end;gap:24px;padding-top:16px;margin-bottom:8px}
.big{width:clamp(120px,22vw,220px);flex:none}
.big .cv{box-shadow:0 12px 40px rgba(0,0,0,.6)}
.act{padding:14px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.act .pbtn{width:58px;height:58px}
.row{display:grid;grid-template-columns:28px 1fr auto 48px;align-items:center;gap:12px;padding:6px 12px;border-radius:6px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.1)}
.row .n{color:var(--mut);text-align:right}
.row .ti{display:flex;align-items:center;gap:12px;min-width:0}
.row .ti .cv{width:40px;flex:none}
.row .ti div{min-width:0}
.row b,.row span.a{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row span.a{color:var(--mut);font-size:13px}
.row .du{color:var(--mut);font-size:13px}
.row.cur b,.row.cur .n{color:var(--ac)}
.hb{color:var(--mut);width:32px;height:32px;display:grid;place-items:center}
.hb svg{width:20px;height:20px}
.hb[data-like] svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.hb:hover{color:#fff}
.hb.on{color:var(--ac)}
.hb[data-like].on svg{fill:var(--ac)}
.sb{display:flex;align-items:center;gap:10px;background:#242424;border-radius:500px;padding:0 16px;height:46px;max-width:440px;margin-bottom:8px}
.sb input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:15px;min-width:0}
.cat{height:100px;border-radius:8px;padding:14px;font-weight:800;font-size:18px;background:linear-gradient(135deg,hsl(var(--h) 6% 32%),hsl(var(--h) 4% 16%));cursor:pointer;overflow:hidden;word-break:break-word}
.add{display:inline-flex;gap:8px;align-items:center;background:#fff;color:#000;border-radius:500px;padding:10px 18px;font-weight:700;cursor:pointer;margin-bottom:22px}
.add:hover{transform:scale(1.03)}
#pl{grid-column:1/3;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:12px;padding:0 8px}
.inf{display:flex;align-items:center;gap:12px;min-width:0}
.inf .cv{width:56px;flex:none;cursor:pointer}
.inf>div{min-width:0}
.inf>div.tx{cursor:pointer}
.inf b,.inf span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.inf span{color:var(--mut);font-size:12px}
.center{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:722px;width:100%;margin:auto}
.ctl{display:flex;align-items:center;gap:14px}
.ctl button{color:var(--mut);display:grid;place-items:center;width:34px;height:34px}
.ctl button:hover{color:#fff}
.ctl .on{color:var(--ac)}
.ctl #pp{background:#fff;color:#000;border-radius:50%;width:38px;height:38px}
.ctl #pp:hover{transform:scale(1.07)}
button>i{font-style:normal;font-size:9px;font-weight:800;position:absolute;right:3px;top:3px}
.bar{display:flex;align-items:center;gap:8px;width:100%;color:var(--mut);font-size:11px}
.bar input{flex:1;min-width:0}
.vol{display:flex;align-items:center;gap:8px;justify-content:flex-end;color:var(--mut)}
.vol input{width:110px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,#fff var(--p,0%),#4d4d4d 0);outline:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff;opacity:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{opacity:1}
input[type=range]:hover::-moz-range-thumb{opacity:1}
input[type=range]:hover{background:linear-gradient(to right,var(--ac) var(--p,0%),#4d4d4d 0)}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#bn{display:none}
@media(hover:none){.tile .pbtn,.card .pbtn{display:none}input[type=range]::-webkit-slider-thumb{opacity:1}}
@media(max-width:760px){
#app{grid-template-columns:1fr;grid-template-rows:1fr auto auto;gap:6px;padding:6px}
#side{display:none}
#main{padding:16px 14px 20px}
.mlogo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3em;margin-bottom:16px}
.mlogo svg{width:26px;height:26px}
.tiles{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:repeat(2,1fr);gap:12px}
.hd{flex-direction:column;align-items:flex-start}
.row{grid-template-columns:22px 1fr auto 34px;gap:6px;padding:6px 4px}
.hb{width:28px}
#pl{grid-column:1;grid-template-columns:1fr auto;gap:6px 8px;background:#2a2a2a;border-radius:10px;padding:8px 10px}
.center{display:contents}
.ctl{grid-column:2;grid-row:1}
.ctl .sec{display:none}
.bar{grid-column:1/3;grid-row:2}
.vol{display:none}
#bn{display:flex;justify-content:space-around;padding:2px 0 max(2px,env(safe-area-inset-bottom))}
#bn button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:6px 24px}
#bn button.on{color:#fff}
}

[hidden]{display:none!important}
#auth{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 0,#2c2c2e,#000 70%);display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:380px;background:#141414;border:1px solid #2a2a2a;border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.box .logo{justify-content:center;padding:0 0 6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#222;border-radius:500px;padding:3px}
.tabs button{padding:8px;border-radius:500px;color:var(--mut);font-weight:700}
.tabs .on{background:#3a3a3c;color:#fff}
#af{display:flex;flex-direction:column;gap:10px}
#af input,#md input:not([type=file]),#md textarea{background:#222;border:1px solid #333;border-radius:8px;color:#fff;font:inherit;padding:12px 14px;width:100%;outline:0}
#af .add{justify-content:center;margin:0}
.err{color:#ff8a8a;min-height:18px;font-size:13px}
#md{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
.mb{position:relative;width:100%;max-width:480px;max-height:90dvh;overflow:auto;background:#161616;border:1px solid #2a2a2a;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.mb h2{margin:0 28px 0 0}
.mb label{display:flex;flex-direction:column;gap:6px;color:var(--mut);font-weight:600}
.mb input[type=file]{color:var(--mut)}
.mb .add{margin:0;align-self:flex-start}
.mb .add.w{align-self:stretch;justify-content:flex-start}
.x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;color:var(--mut)}
.x:hover{background:#2a2a2a;color:#fff}
.ly{white-space:pre-wrap;font-family:inherit;font-size:16px;line-height:1.7}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.prof span{display:block}
.av{width:44px;height:44px;border-radius:50%;background:#3a3a3c;display:grid;place-items:center;font-weight:800;flex:none}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.btns .add{margin:0}
.add.g{background:#2a2a2c;color:#fff}
.ac{display:flex}
.tb{color:var(--mut);border:1px solid #3a3a3c;border-radius:500px;padding:4px 12px;font-size:12px;flex:none}
.tb:hover{color:#fff;border-color:#fff}
.meb{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 8px;border-top:1px solid #222}
.meb div:nth-child(2){flex:1;min-width:120px}
.meb span{display:block;color:var(--mut);font-size:12px}
.mlist{display:flex;flex-direction:column;gap:6px}
#ts{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:500px;font-weight:700;z-index:60;max-width:90vw;text-align:center}

/* ---- Большой плеер ---- */
#np{position:fixed;inset:0;z-index:30;--c:110 50 55;background:radial-gradient(circle at 85% 25%,rgb(var(--c)/.6),transparent 65%),linear-gradient(160deg,rgb(var(--c)/.9),#0a0a0a 88%);display:grid;grid-template-columns:minmax(0,min(48vw,calc(100dvh - 140px))) 1fr;grid-template-rows:1fr auto;gap:14px 24px;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));overflow:hidden}
.npx{position:absolute;right:14px;top:max(10px,env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:2}
.npc{position:relative;align-self:start;aspect-ratio:1;border-radius:22px;overflow:hidden;display:grid;place-items:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.npc .bigi{width:30%;height:30%;fill:rgba(255,255,255,.8)}
.npo{position:absolute;inset:auto 12px 12px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.npo:before{content:"";position:absolute;inset:-120px -12px -12px;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:-1;pointer-events:none}
.pill2{background:rgba(0,0,0,.78);border-radius:18px;padding:6px 20px;font-size:clamp(18px,3vw,34px);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill2+.pill2{font-size:clamp(16px,2.6vw,30px)}
.npa{display:flex;gap:10px;width:100%;align-items:center}
.npa .sp{flex:1}
.nb{width:70px;height:70px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;flex:none}
.nb svg{width:48%;height:48%}
.nb.l{width:96px;height:96px}
.nb.s{width:46px;height:46px;background:rgba(0,0,0,.25);color:rgba(255,255,255,.6)}
.nb.m{width:56px;height:56px}
.nb.m svg{width:50%;height:50%}
.nb.m.on{background:#fff;color:#000}
.npr{display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0}
.wv{position:relative;height:clamp(150px,32vh,290px);touch-action:none;cursor:pointer;--p:0%}
.wl{position:absolute;inset:0;display:flex;align-items:center;gap:3px;color:rgba(255,255,255,.3)}
.wl i{flex:1;border-radius:3px;background:currentColor;min-width:2px}
.wl.top{color:#fff;clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.npctl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;pointer-events:none}
.npctl .nb{pointer-events:auto}
.tms{display:flex;justify-content:space-between}
.tp{background:#000;border-radius:500px;padding:6px 14px;font-weight:700;font-size:clamp(15px,2vw,22px)}
.chip{align-self:center;font-size:12px;font-weight:700;background:rgba(0,0,0,.25);color:#ddd;padding:6px 16px;border-radius:500px;text-transform:uppercase;min-height:26px}
.nbr{display:flex;justify-content:space-between;gap:10px}
.pg{display:flex;gap:6px}
.pb{width:68px;height:48px;border-radius:24px;background:rgba(0,0,0,.28);color:rgba(255,255,255,.75);display:grid;place-items:center}
.pb.on{color:#fff;background:rgba(0,0,0,.6)}
.npn{grid-column:1/-1;display:flex;justify-content:space-around;align-items:center;background:#141414;border-radius:30px;height:80px}
.npn button{color:#cfcfd1;padding:14px 40px}
.npn svg{width:34px;height:34px}
@media(max-width:760px),(max-aspect-ratio:1/1){
#np{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;gap:12px}
.npc{width:min(100%,44dvh);justify-self:center;border-radius:18px}
.wv{height:clamp(120px,22vh,200px)}
.nb{width:54px;height:54px}.nb.l{width:72px;height:72px}.nb.s{width:36px;height:36px}
.npn{height:64px}.npn button{padding:10px 20px}
.npx{top:auto;bottom:80px;display:none}
}

/* ===== Zenith+ ===== */
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
@keyframes fd{from{opacity:0}}
@keyframes npin{from{opacity:0;transform:translateY(7%)}}
@keyframes beat{50%{transform:scale(1.45)}}
@keyframes ring{from{box-shadow:0 0 0 0 rgba(255,255,255,.4)}to{box-shadow:0 0 0 24px transparent}}
@keyframes glow{50%{box-shadow:0 14px 70px rgb(var(--c)/.85)}}
@keyframes orb{to{transform:translate(12vw,10vh) scale(1.2)}}
@keyframes eqs{0%,100%{background-size:3px 30%,3px 90%,3px 55%}33%{background-size:3px 100%,3px 40%,3px 80%}66%{background-size:3px 55%,3px 70%,3px 25%}}
.go .card,.go .tile,.go .row,.go .cat{animation:up .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0)*40ms)}
.go>h1,.go>h2,.go>.hd,.go>.sb,.go>.prof{animation:up .5s cubic-bezier(.2,.8,.2,1) backwards}
.card,.tile,.lrow,.nv{transition:background .2s,transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.tile:hover{transform:translateY(-2px)}.nv:hover{transform:translateX(4px)}.lrow:hover{transform:translateX(3px)}
button:active{transform:scale(.94)}
.card .cv{transition:transform .35s}.card:hover .cv{transform:scale(1.04)}
.logo svg{transition:transform .8s cubic-bezier(.3,1.4,.5,1)}.logo:hover svg{transform:rotate(360deg)}
#md:not([hidden]){animation:fd .2s}
#md:not([hidden]) .mb{animation:pop .3s cubic-bezier(.2,.8,.2,1)}
#np:not([hidden]){animation:npin .5s cubic-bezier(.2,.8,.2,1)}
.box{position:relative;z-index:1;animation:pop .6s cubic-bezier(.2,.8,.2,1)}
#auth{overflow:hidden}
#auth::before,#auth::after{content:"";position:absolute;width:44vmax;height:44vmax;border-radius:50%;background:var(--ac);filter:blur(100px);opacity:.22;animation:orb 16s ease-in-out infinite alternate;pointer-events:none}
#auth::before{left:-12vmax;top:-12vmax}#auth::after{right:-12vmax;bottom:-12vmax;animation-delay:-8s;background:#5b8cff}
.hb.on[data-like] svg,.nb.m.on svg{animation:beat .4s}
body.ply #npp{animation:ring 1.8s infinite}body.ply #nc{animation:glow 3.2s ease-in-out infinite}
.row.cur .n{color:transparent;position:relative}
.row.cur .n::after{content:"";position:absolute;right:0;top:50%;width:15px;height:14px;margin-top:-7px;background:linear-gradient(var(--ac),var(--ac)) 0 100%,linear-gradient(var(--ac),var(--ac)) 50% 100%,linear-gradient(var(--ac),var(--ac)) 100% 100%;background-repeat:no-repeat;animation:eqs 1s infinite ease-in-out;animation-play-state:paused}
body.ply .row.cur .n::after{animation-play-state:running}
.lrow{position:relative}
.cx{position:absolute;top:22px;right:22px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:.2s}
.cx svg{width:18px;height:18px}.cx:hover{background:#c0392b}
.card:hover .cx,.lrow:hover .cx,.cx:focus-visible{opacity:1;transform:none}
.sx{top:50%;right:8px;margin-top:-17px}
@media(hover:none){.cx{opacity:1;transform:none}}
.pb{font-size:13px;font-weight:700}
.lyo{position:absolute;inset:0;overflow:auto;padding:70px 20px 210px;background:rgba(0,0,0,.52);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 72%,transparent)}
.lyo::-webkit-scrollbar{display:none}
.lyo p{font-size:clamp(18px,2.4vw,26px);font-weight:800;line-height:1.35;margin:0 0 .7em;color:rgba(255,255,255,.35);cursor:pointer;transition:.35s;transform-origin:left}
.lyo p:hover{color:rgba(255,255,255,.7)}.lyo p.on{color:#fff;transform:scale(1.06)}
.lyo .ly{font-size:clamp(16px,2vw,22px);color:#fff}
.mb label.set,.mb div.set{flex-direction:row;justify-content:space-between;align-items:center;gap:12px;color:#fff;display:flex}
.set small{display:block;color:var(--mut);font-weight:400}
#md .set input[type=checkbox]{-webkit-appearance:none;appearance:none;width:44px;height:26px;padding:0;border:0;border-radius:13px;background:#3a3a3c;position:relative;cursor:pointer;transition:.2s;flex:none}
#md .set input[type=checkbox]::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
#md .set input[type=checkbox]:checked{background:var(--ac)}
#md .set input[type=checkbox]:checked::after{transform:translateX(18px);background:#000}
.sws{display:flex;gap:8px}.swc{width:28px;height:28px;border-radius:50%;border:2px solid transparent;transition:.2s}.swc.on{border-color:#fff;box-shadow:inset 0 0 0 3px #161616}
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Zenith v3 ===== */
#viz{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.npr,.npn{position:relative}

.mb{background:rgba(22,22,24,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.add{box-shadow:0 8px 26px color-mix(in srgb,var(--ac) 30%,transparent)}.add.g{box-shadow:none}
#ts{z-index:80;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:max-content;box-shadow:0 10px 30px rgba(0,0,0,.45)}#ts:not([hidden]){animation:tin .35s cubic-bezier(.2,.8,.2,1)}@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(.96)}}
.ap{aspect-ratio:1;background:linear-gradient(135deg,hsl(var(--h) 60% 40%),hsl(var(--h) 55% 16%)) center/cover;display:grid;place-items:center;font-weight:800;font-size:clamp(18px,4vw,30px);color:rgba(255,255,255,.92);transition:.3s}
.cv.ap,.ap{border-radius:50%!important}.ap.ph span{display:none}

.empty .btns{justify-content:center}
.cta{cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;margin-bottom:10px;background:linear-gradient(120deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1);transition:.25s}
.cta:hover{transform:translateY(-2px)}.cta b{display:block}.cta span{color:var(--mut)}
.up{display:flex;flex-direction:column;gap:12px}
.uph{display:flex;gap:14px;align-items:center;padding-right:30px}.uph h2{margin:0}.uph p{margin:2px 0 0;color:var(--mut);font-size:13px}
.upi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),#5b8cff);color:#000;flex:none}.upi svg{width:24px;height:24px}
.dz{align-items:center;text-align:center;padding:26px 16px;border:2px dashed #3a3a3c;border-radius:18px;cursor:pointer;transition:.25s;background:rgba(255,255,255,.03);color:#fff!important}
.dz:hover,.dz.drag{border-color:var(--ac);background:rgba(255,255,255,.07);transform:scale(1.01)}.dz.ok{border-style:solid;border-color:var(--ac)}
.dzi{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08)}.dzi svg{width:26px;height:26px}.dz.drag .dzi{animation:beat .6s infinite}
.dz span{color:var(--mut);font-size:12px;font-weight:400}.dz b{font-size:15px;word-break:break-all}
.upg{display:flex;gap:12px}.upf{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.cvx{width:112px;flex:none;cursor:pointer}
#cvp{aspect-ratio:1;border-radius:14px;border:2px dashed #3a3a3c;display:grid;place-content:center;justify-items:center;gap:4px;color:var(--mut);background:#1c1c1e center/cover;transition:.25s}.cvx:hover #cvp{border-color:var(--ac);color:#fff}
#off{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:70;padding:8px 16px;border-radius:999px;background:rgba(30,30,32,.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:600;white-space:nowrap;animation:pop .4s}
#off::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffb020;margin-right:8px}
#pick{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:radial-gradient(900px 500px at 15% -10%,hsl(265 70% 30%/.6),transparent 60%),radial-gradient(800px 500px at 100% 10%,rgba(91,140,255,.22),transparent 60%),#0b0b0c;animation:fd .4s}
#pick .x{position:fixed;top:14px;right:14px;z-index:2}
.pkh{padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 4px;max-width:1100px;width:100%;margin:0 auto}
.pkh h1{font-size:clamp(26px,5vw,40px);margin:0 0 6px}.pkh p{color:var(--mut);margin:0 0 14px}
.pks{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:999px;padding:0 16px}.pks input{flex:1;background:none;border:0;color:#fff;padding:13px 0;font:inherit;outline:0}
.pkc{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.pkc button{flex:none;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:13px;transition:.2s}.pkc button.on{background:#fff;color:#000}
.pkg{flex:1;overflow:auto;max-width:1100px;width:100%;margin:0 auto;padding:10px 20px 150px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px 14px;align-content:start}
.ar{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:#fff;padding:6px;border-radius:16px;transition:.25s}.ar b{font-size:13px;line-height:1.2}

.pkf{position:fixed;left:0;right:0;bottom:0;padding:34px 20px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;justify-content:center;gap:16px;background:linear-gradient(transparent,#0b0b0c 60%)}
#pkn{font-weight:600}#pdone{animation:up .45s cubic-bezier(.3,1.5,.5,1)}

/* ===== Zenith v5 ===== */
#md{z-index:65}

/* ===== Zenith v6: Material 3 + Liquid Glass ===== */
@property --ah{syntax:'<number>';inherits:true;initial-value:260}
:root{--ease:cubic-bezier(.2,0,0,1);--spring:cubic-bezier(.34,1.56,.64,1);--md-sec:color-mix(in srgb,var(--ac) 24%,rgba(40,40,46,.6));--glass:rgba(24,24,30,.42);--edge:rgba(255,255,255,.16);--sheen:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 40%,rgba(255,255,255,.08))}
body{--ah:260;transition:--ah 1.4s ease;background:#050507}
/* живой фон: цвет плывёт за обложкой трека */
body::before,body::after{content:"";position:fixed;z-index:0;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
body::before{left:-22vmax;top:-26vmax;background:hsl(var(--ah) 80% 42%);animation:drift 24s ease-in-out infinite alternate}
body::after{right:-26vmax;bottom:-30vmax;background:hsl(calc(var(--ah) + 70) 75% 40%);animation:drift 30s ease-in-out -10s infinite alternate-reverse}
@keyframes drift{to{transform:translate(16vmax,12vmax) scale(1.18) rotate(50deg)}}
#app{position:relative;z-index:1}
/* стекло */
#side,#pl,#bn,#main,.box,.npn{backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.05),0 16px 48px rgba(0,0,0,.35)}
#side,#pl,#bn,.box,.npn{background:var(--sheen),var(--glass)}
#side,#pl,#bn,#main,.box{border-radius:28px}
#side,#pl,#bn{position:relative}
#pl{padding:0 20px}
#main{background:radial-gradient(900px 420px at 10% -8%,hsl(var(--h,260) 55% 30%/.55),transparent 62%),radial-gradient(700px 400px at 100% 0,rgba(91,140,255,.14),transparent 60%),rgba(14,14,18,.5)}
.lh{background:linear-gradient(rgba(20,20,24,.7),transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* блик следует за курсором */
:is(#side,#pl,#bn,.box,.npn,.card,.tile){position:relative}
:is(#side,#pl,#bn,.box,.npn,.card,.tile)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0),rgba(255,255,255,.13),transparent 70%)}
:is(#side,#pl,#bn,.box,.npn,.card,.tile):hover::after{opacity:1}
/* карточки, строки, навигация */
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:background .3s,transform .5s var(--spring),box-shadow .3s}
.card:hover{background:rgba(255,255,255,.12);transform:translateY(-6px) scale(1.015);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 18px 40px rgba(0,0,0,.4)}
.card .cv{border-radius:14px}
.tile{border-radius:16px;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.cat,.cta,.empty{border-radius:20px}
.row,.lrow{border-radius:14px}
.row:hover,.lrow:hover{background:rgba(255,255,255,.08)}
.row.cur,.row.cur:hover{background:var(--md-sec)}
.nv{border-radius:999px;isolation:isolate;padding:12px 18px}
.nv::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--md-sec);opacity:0;z-index:-1}
.nv.on::before{opacity:1;animation:ind .5s var(--ease) backwards}
@keyframes ind{from{transform:scaleX(.35);transform-origin:left;opacity:0}}
.nv:hover:not(.on){background:rgba(255,255,255,.07)}
#bn button svg{box-sizing:content-box;padding:4px 6px;border-radius:16px}
#bn button.on svg{padding:4px 20px;background:var(--md-sec);animation:navi .45s var(--ease)}
@keyframes navi{from{padding-inline:6px;background:transparent}}
/* кнопки: форма меняется play ↔ pause (Material Expressive) */
.pbtn,.tile .pbtn,.card .pbtn{border-radius:18px;background:var(--ac);transition:border-radius .4s var(--ease),opacity .25s,transform .4s var(--spring),box-shadow .3s}
.pbtn:hover{border-radius:50%}
.ctl #pp{background:var(--ac);border-radius:50%;transition:border-radius .4s var(--ease),transform .35s var(--spring)}
body.ply .ctl #pp{border-radius:14px}
.ctl button,.hb{border-radius:50%;transition:background .2s,color .2s,transform .35s var(--spring)}
.ctl button:hover,.hb:hover,.x:hover{background:rgba(255,255,255,.1)}
body.ply #pc{box-shadow:0 6px 26px hsl(var(--h) 65% 48%/.55)}
.inf .cv{border-radius:14px;transition:box-shadow .6s}
/* большой плеер */
.nb,.nb.s,.nb.m{background:rgba(255,255,255,.16);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.1),0 8px 24px rgba(0,0,0,.25);transition:border-radius .45s var(--ease),transform .4s var(--spring),background .25s}
.nb.s{color:rgba(255,255,255,.85)}
.nb.l{background:var(--ac);color:#000}
body.ply #npp{border-radius:32px}
.pill2,.tp,.chip,.pb,.npx{background:rgba(20,20,26,.34);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.1)}
.pill2,.tp{border-radius:20px}
.pb{transition:background .25s,transform .35s var(--spring)}
.pb.on{background:rgba(255,255,255,.28)}
.npn{border-radius:28px}
/* ползунки M3 */
input[type=range]{height:6px;border-radius:3px;background:linear-gradient(to right,var(--ac) var(--p,0%),rgba(255,255,255,.2) 0)}
input[type=range]::-webkit-slider-thumb{width:5px;height:22px;border-radius:3px;background:var(--ac);transition:transform .2s var(--spring)}
input[type=range]::-moz-range-thumb{width:5px;height:22px;border-radius:3px;background:var(--ac)}
input[type=range]:active::-webkit-slider-thumb{transform:scaleX(.7)}
/* поиск, формы, переключатели */
.sb{height:56px;background:rgba(255,255,255,.08);border:1px solid var(--edge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:max-width .5s var(--ease),box-shadow .3s,background .3s}
.sb:focus-within{max-width:600px;background:rgba(255,255,255,.13);box-shadow:0 0 0 2px var(--ac),0 12px 36px rgba(0,0,0,.35)}
#af input,#md input:not([type=file]),#md textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;transition:border-color .2s,box-shadow .25s}
#af input:focus,#md input:not([type=file]):focus,#md textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
.tabs{background:rgba(255,255,255,.07)}.tabs .on{background:var(--md-sec)}
.mi{border-radius:16px;background:rgba(255,255,255,.07)}.mi:hover{background:rgba(255,255,255,.13)}
#md .set input[type=checkbox]{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
#md .set input[type=checkbox]::after{left:8px;top:8px;width:16px;height:16px;background:#c9c5ca;transition:all .35s var(--spring)}
#md .set input[type=checkbox]:active::after{width:28px;height:28px;left:2px;top:2px}
#md .set input[type=checkbox]:checked{background:var(--ac);box-shadow:none}
#md .set input[type=checkbox]:checked::after{left:4px;top:4px;width:24px;height:24px;transform:translateX(20px);background:#000}
/* окна, тост */
#md{background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mb{border-radius:28px;background:var(--sheen),rgba(28,28,34,.55);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 30px 80px rgba(0,0,0,.5)}
@keyframes mdin{from{opacity:0;transform:translateY(40px) scale(.9);filter:blur(10px)}}
#md:not([hidden]) .mb{animation:mdin .55s var(--spring)}
#ts{background:rgba(245,245,250,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-radius:16px;box-shadow:inset 0 1px 0 #fff,0 14px 40px rgba(0,0,0,.4)}
/* анимации появления */
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.97)}}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(16px);filter:blur(8px)}}
@keyframes npin{from{opacity:0;transform:translateY(14%) scale(.94);filter:blur(12px)}}
/* ripple */
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);pointer-events:none;animation:rpl .65s var(--ease) forwards}
@keyframes rpl{to{transform:scale(1);opacity:0}}
button:not(.ar),.row,.lrow,.nv,.add,.tb,.mi,.cta,.gb,.cat{overflow:hidden}
.row,.mi,.cta,.cat,.add,.tb,.gb{position:relative}
@supports not (backdrop-filter:blur(1px)) and not (-webkit-backdrop-filter:blur(1px)){#side,#pl,#bn,#main,.box,.mb,.npn{background-color:#17171c}}
@media(max-width:760px){#pl{border-radius:24px;padding:10px 14px}#main,#side{border-radius:24px}}

/* ===== ZENITH Settings Studio ===== */
#main.settings-page{padding:clamp(18px,3vw,34px);background:radial-gradient(700px 360px at 0 0,rgba(167,139,250,.16),transparent 70%),rgba(14,14,18,.72)}

const[SK,SH]=(()=>{const k=[],h=[];for(let c=2,n=0;n<64;c++){let p=1;for(let d=2;d*d<=c;d++)if(c%d==0){p=0;break}if(p){if(n<8)h[n]=Math.pow(c,.5)*4294967296|0;k[n++]=Math.pow(c,1/3)*4294967296|0}}return[k,h]})();

 const m=[...new TextEncoder().encode(s)],L=m.length*8;m.push(128);while(m.length%64!=56)m.push(0);
 for(let i=7;i>=0;i--)m.push(i>3?0:(L>>>(i*8))&255);

 for(let o=0;o<m.length;o+=64){

  let[a,b,c,d,e,f,g,h]=H;

  [a,b,c,d,e,f,g,h].forEach((v,i)=>{H[i]=H[i]+v|0})
 }

const N=64;

async function loadPk(t){

  try{
   const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;let dc;
   try{dc=new OC(1,1,8000)}catch(e){init();dc=ctx}
   const d=await dc.decodeAudioData(await t.rec.audio.arrayBuffer()),c=d.getChannelData(0),b=Math.max(1,Math.floor(c.length/N)),pk=[];let mx=1e-4;
   for(let i=0;i<N;i++){let s=0,n=0;const e=Math.min(c.length,(i+1)*b),st=Math.max(1,(b/300)|0);for(let j=i*b;j<e;j+=st){s+=Math.abs(c[j]);n++}const v=n?s/n:0;pk.push(v);mx=Math.max(mx,v)}

  if(cur==t)drawWave()
 }
}

const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const d2b=d=>fetch(d).then(r=>r.blob());
const ser=async o=>o instanceof Blob?{__b:await b2d(o)}:Array.isArray(o)?Promise.all(o.map(ser)):o&&typeof o=='object'?Object.fromEntries(await Promise.all(Object.entries(o).map(async([k,v])=>[k,await ser(v)]))):o;
const de=async o=>o&&o.__b?await d2b(o.__b):Array.isArray(o)?Promise.all(o.map(de)):o&&typeof o=='object'?Object.fromEntries(await Promise.all(Object.entries(o).map(async([k,v])=>[k,await de(v)]))):o;

}

  OV={...OV,...(d.ov||{})};await put('kv',OV,'ov');

}

/* --- статистика прослушиваний (только на этом устройстве) --- */
const stKey=()=>'zst_'+(me?me.key:'');
function stLoad(){try{const d=JSON.parse(localStorage[stKey()]||'{}');d.t=d.t||0;d.n=d.n||0;d.tr=d.tr||{};d.ar=d.ar||{};d.d=d.d||{};return d}catch(e){return{t:0,n:0,tr:{},ar:{},d:{}}}}
let stD=null,stFor=null,stId=null,stAcc=0,stDirty=0;
function stSave(){if(!stD||stFor==null)return;try{localStorage['zst_'+stFor]=JSON.stringify(stD)}catch(e){}stDirty=0}
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
setInterval(()=>{
 if(!playing||!cur||!me||!+S.stats)return;
 if(stFor!==me.key){stSave();stFor=me.key;stD=stLoad()}
 if(stId!==cur.id){stId=cur.id;stAcc=0}
 stAcc++;stD.t++;
 const e=stD.tr[cur.id]=stD.tr[cur.id]||{n:0,s:0};e.s++;
 const a=cur.artist||'—';stD.ar[a]=(stD.ar[a]||0)+1;
 const dk=dayKey();stD.d[dk]=(stD.d[dk]||0)+1;
 if(stAcc===30){e.n++;stD.n++}
 if(++stDirty>=15)stSave()
},1000);
addEventListener('pagehide',stSave);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stSave()});
function hm(s){s=Math.round(s);const h=s/3600|0,m=(s%3600)/60|0;return h?h+' ч '+m+' мин':m?m+' мин':s+' сек'}
function statsModal(){
 if(!me)return;if(stFor===me.key)stSave();const d=stLoad(),now=new Date();
 const tod=d.d[dayKey()]||0;let wk=0;for(let i=0;i<7;i++){const x=new Date(now-i*864e5),k=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');wk+=d.d[k]||0}
 const tt=Object.entries(d.tr).filter(([id])=>tr(id)).sort((a,b)=>b[1].s-a[1].s).slice(0,5),
  aa=Object.entries(d.ar).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=aa.length?aa[0][1]:1;
 modal(`<h2>Моя статистика</h2><div class="stg"><div><b>${hm(d.t)}</b><span>всего</span></div><div><b>${hm(tod)}</b><span>сегодня</span></div><div><b>${hm(wk)}</b><span>7 дней</span></div><div><b>${d.n}</b><span>прослушиваний</span></div></div>
 ${tt.length?`<h3 class="sth">Топ треков</h3><div class="qlist">${tt.map(([id,e],i)=>{const t=tr(id);return `<div class="qrow" data-qst="${id}"><span class="qn">${i+1}</span>${tcv(t)}<div class="qt"><b>${esc(t.title)}</b><span>${esc(t.artist)} · ${e.n} ${e.n%10>1&&e.n%10<5&&(e.n%100<10||e.n%100>19)?'раза':'раз'} · ${hm(e.s)}</span></div></div>`}).join('')}</div>`:'<p class="mut" style="padding:14px 0">Пока пусто — послушайте пару песен, и здесь появится статистика.</p>'}
 ${aa.length?`<h3 class="sth">Топ исполнителей</h3><div class="stb">${aa.map(([n,s])=>`<div class="sbr"><span>${esc(n)}</span><i style="--w:${Math.max(6,Math.round(s/mx*100))}%"></i><em>${hm(s)}</em></div>`).join('')}</div>`:''}
 <div class="btns" style="margin:12px 0 0"><button class="add g" data-a="stclr">Сбросить статистику</button></div><p class="mut" style="font-size:12px;margin-top:8px">Данные хранятся только на этом устройстве.</p>`)
}

 /* ---------- универсальный загрузчик файла ---------- */
 const KIND={
  sv:{k:'video',b:'Загрузить видео',h:'MP4 или WebM · до 7 секунд · без звука',ic:IC.mov},
  tcf:{k:'image',b:'Выбрать новую обложку',h:'JPG, PNG или WebP · квадрат выглядит лучше',ic:IC.img},

  artistCoverFile:{k:'image',b:'Выбрать изображение',h:'Квадратная картинка хорошего качества',ic:IC.img}
 };
 function enhanceFiles(root){
  root.querySelectorAll('input[type=file]:not([data-fp])').forEach(inp=>{
   if(inp.hidden||inp.closest('.dz,.cvx,.pfx'))return;
   const lab=inp.closest('label');if(!lab)return;
   inp.dataset.fp='1';
   const kd=KIND[inp.id]||{k:'image',b:'Выбрать файл',h:'Нажми или перетащи сюда',ic:IC.img};
   let cur=null;
   if(inp.id=='tcf'){try{const t=tr(EDT);cur=t&&t.cover||null}catch(e){}}
   lab.classList.add('fp','fp-'+kd.k);
   const box=document.createElement('div');box.className='fpb';
   box.innerHTML=`<div class="fpv">${kd.ic}<span class="fpo">${IC.cam}</span></div><div class="fpt"><b></b><span></span></div><span class="fpbtn">Выбрать</span><button type="button" class="fpx" hidden aria-label="Убрать файл">✕</button>`;
   lab.appendChild(box);
   const v=box.querySelector('.fpv'),nb=box.querySelector('.fpt b'),ns=box.querySelector('.fpt span'),bt=box.querySelector('.fpbtn'),x=box.querySelector('.fpx');
   let obj=null;
   const idle=()=>{
    if(obj){URL.revokeObjectURL(obj);obj=null}
    v.querySelectorAll('video,.fpplay').forEach(n=>n.remove());
    box.classList.remove('ok','bad');x.hidden=true;
    if(cur){v.style.backgroundImage=`url('${cur}')`;box.classList.add('has');nb.textContent='Текущая обложка';ns.textContent='Нажми, чтобы заменить';bt.textContent='Заменить'}
    else{v.style.backgroundImage='';box.classList.remove('has');nb.textContent=kd.b;ns.textContent=kd.h;bt.textContent='Выбрать'}
   };
   const bad=m=>{box.classList.remove('ok');box.classList.add('bad');ns.textContent=m;x.hidden=false};
   const upd=f=>{
    if(!f){idle();return}
    if(obj)URL.revokeObjectURL(obj);obj=URL.createObjectURL(f);
    v.querySelectorAll('video,.fpplay').forEach(n=>n.remove());
    box.classList.remove('bad');box.classList.add('ok','has');x.hidden=false;bt.textContent='Заменить';
    nb.textContent=f.name;ns.textContent=fsz(f.size);
    if(kd.k=='video'){
     if(!/^video\//.test(f.type)){bad('Это не видеофайл');return}
     v.style.backgroundImage='';
     const vd=document.createElement('video');vd.muted=true;vd.loop=true;vd.autoplay=true;vd.playsInline=true;vd.setAttribute('playsinline','');vd.src=obj;
     vd.addEventListener('loadedmetadata',()=>{
      const d=vd.duration,tag=document.createElement('span');tag.className='fpplay';tag.textContent=isFinite(d)?d.toFixed(1)+' с':'видео';v.appendChild(tag);
      if(d>7.6)bad('Видео длиннее 7 секунд ('+Math.round(d)+' с) — обрежь его')});
     vd.addEventListener('error',()=>bad('Не удалось прочитать видео'));
